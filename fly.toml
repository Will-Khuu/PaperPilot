# fly.toml app configuration file generated for paperpilot-api on 2026-10-27T17:57:52-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'paperpilot-api'
primary_region = 'lax'
swap_size_mb = 512

[build]
[env]
  PAPERPILOT_DB = '/data/paperpilot.db'
  PAPERPILOT_DEPLOYED = '1'
  PAPERPILOT_INDEX_DIR = '/data/chroma_db'
  PAPERPILOT_PAPERS_DIR = '/data/papers'

[[mounts]]
  source = 'paperpilot_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
